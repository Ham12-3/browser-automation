[project]
name = "omnibrowse-local-agent"
version = "0.1.0"
description = "Local-first browser automation agent backend for OmniBrowse Agent."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "playwright>=1.44",
  "psutil>=5.9",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
desktop = [
  "pywinauto>=0.6.8",
  "pyautogui>=0.9.54",
  "pillow>=10.3"
]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

